<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erick James Sibayan — 3D Portfolio Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:#e5e5e5;
    font-family:'IBM Plex Sans', sans-serif;
    display:flex; flex-direction:column;
    cursor:none;
  }
  @media (hover:none){ body{ cursor:auto; } }

  .page-header, .page-footer{
    flex:0 0 auto;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#2a2a28;
    padding:22px 16px;
    z-index:5;
  }
  .page-header{ font-size:clamp(11px,1.6vw,14px); }
  .page-footer{ font-size:clamp(9.5px,1.3vw,12px); color:#8a887f; }

  #canvas-wrap{
    flex:1 1 auto;
    position:relative;
    width:100%;
    min-height:0;
  }
  #c{ display:block; width:100%; height:100%; }

  #fadeOverlay{
    position:fixed; inset:0; background:#0a0a09; opacity:0;
    pointer-events:none; z-index:40;
  }

  .cursor-dot, .cursor-ring{
    position:fixed; top:0; left:0; pointer-events:none; z-index:50;
    border-radius:50%; transform:translate(-50%,-50%);
  }
  .cursor-dot{ width:6px; height:6px; background:#14140f; }
  .cursor-ring{
    width:32px; height:32px; border:1px solid rgba(20,20,15,0.45);
    display:flex; align-items:center; justify-content:center;
    transition:width 0.28s ease, height 0.28s ease, background 0.28s ease, border-color 0.28s ease;
  }
  .cursor-ring.hot{
    width:96px; height:96px;
    background:#14140f; border-color:transparent;
  }
  .cursor-ring .lbl{
    opacity:0; transition:opacity 0.2s ease;
    font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:600;
    letter-spacing:0.08em; text-transform:uppercase; color:#f6f4ef; text-align:center;
    white-space:nowrap;
  }
  .cursor-ring.hot .lbl{ opacity:1; }

  .loading{
    position:fixed; inset:0; background:#e5e5e5; z-index:60;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.1em;
    color:#8a887f; text-transform:uppercase;
    transition:opacity 0.5s ease;
  }
</style>
</head>
<body>

<div class="loading" id="loading">Loading scene…</div>

<header class="page-header">Erick James Sibayan — Portfolio</header>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>

<footer class="page-footer">Move to explore · Click the screen to view work</footer>

<div id="fadeOverlay"></div>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"><span class="lbl">Click to<br>View</span></div>

<script>
(function(){
  const wrap = document.getElementById('canvas-wrap');
  const canvas = document.getElementById('c');
  const loading = document.getElementById('loading');

  // ---------- scene ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe5e5e5);
  scene.fog = new THREE.Fog(0xe5e5e5, 8, 16);

  let aspect = wrap.clientWidth / wrap.clientHeight;
  const baseFov = window.innerWidth < 640 ? 46 : 34;
  const camera = new THREE.PerspectiveCamera(baseFov, aspect, 0.1, 100);
  camera.position.set(0, 0.84, 5.2);
  camera.lookAt(0, 0.2, 0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  function sizeRenderer(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = window.innerWidth < 640 ? 46 : 34;
    camera.updateProjectionMatrix();
  }
  sizeRenderer();

  // ---------- lighting ----------
  const ambient = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.55);
  dirLight.position.set(3, 6, 4);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  scene.add(dirLight);

  const spot = new THREE.SpotLight(0xffffff, 1.4, 14, Math.PI/6, 0.5, 1.2);
  spot.position.set(0, 4, 3);
  spot.castShadow = true;
  scene.add(spot);
  scene.add(spot.target);

  const rimLight = new THREE.PointLight(0xbfd9ff, 0.4, 10);
  rimLight.position.set(-3, 1.5, -2);
  scene.add(rimLight);

  // ---------- ground shadow catcher ----------
  const groundGeo = new THREE.PlaneGeometry(30, 30);
  const groundMat = new THREE.ShadowMaterial({ opacity:0.16 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -2.05;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- rig (rock + laptop tilt together) ----------
  const rig = new THREE.Group();
  scene.add(rig);

  // low-poly volcanic rock pedestal
  const rockGeo = new THREE.IcosahedronGeometry(1.7, 1);
  const posAttr = rockGeo.attributes.position;
  const v = new THREE.Vector3();
  for(let i=0; i<posAttr.count; i++){
    v.fromBufferAttribute(posAttr, i);
    const n = v.clone().normalize();
    const disp = (Math.random() - 0.35) * 0.34;
    v.addScaledVector(n, disp);
    posAttr.setXYZ(i, v.x, v.y, v.z);
  }
  rockGeo.computeVertexNormals();
  const rockMat = new THREE.MeshStandardMaterial({
    color: 0x2f2f2c, flatShading:true, roughness:0.95, metalness:0.05
  });
  const rock = new THREE.Mesh(rockGeo, rockMat);
  rock.scale.set(1.5, 0.72, 1.25);
  rock.position.y = -1.55;
  rock.castShadow = true;
  rock.receiveShadow = true;
  rig.add(rock);

  // ---------- laptop ----------
  const laptop = new THREE.Group();
  laptop.position.y = 0.12;
  rig.add(laptop);

  const metalMat = new THREE.MeshStandardMaterial({ color:0x1b1b1a, roughness:0.35, metalness:0.55 });

  const deckGeo = new THREE.BoxGeometry(2.6, 0.09, 1.7);
  const deck = new THREE.Mesh(deckGeo, metalMat);
  deck.position.set(0, -0.72, 0.1);
  deck.castShadow = true; deck.receiveShadow = true;
  laptop.add(deck);

  const hingeGeo = new THREE.CylinderGeometry(0.05, 0.05, 2.5, 16);
  const hinge = new THREE.Mesh(hingeGeo, metalMat);
  hinge.rotation.z = Math.PI/2;
  hinge.position.set(0, -0.675, -0.72);
  laptop.add(hinge);

  const bezelGeo = new THREE.BoxGeometry(2.6, 1.62, 0.07);
  const bezel = new THREE.Mesh(bezelGeo, metalMat);
  bezel.position.set(0, 0.08, -0.78);
  bezel.rotation.x = -0.08;
  bezel.castShadow = true;
  laptop.add(bezel);

  // canvas-drawn screen texture
  const texCanvas = document.createElement('canvas');
  texCanvas.width = 1024; texCanvas.height = 640;
  const ctx = texCanvas.getContext('2d');

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function drawScreen(hot){
    ctx.fillStyle = '#f6f4ef';
    ctx.fillRect(0, 0, 1024, 640);

    ctx.fillStyle = '#14140f';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.font = '600 20px IBM Plex Sans, sans-serif';
    ctx.fillText('ABOUT', 44, 40);
    ctx.fillText('PROJECTS', 168, 40);
    ctx.fillText('CONTACT', 336, 40);

    ctx.textAlign = 'center';
    ctx.font = '800 78px IBM Plex Sans, sans-serif';
    ctx.fillText('ERICK JAMES', 512, 250);
    ctx.fillText('SIBAYAN', 512, 336);

    const pillW = 250, pillH = 58, pillX = 512 - pillW/2, pillY = 440;
    ctx.strokeStyle = hot ? '#14140f' : '#8a887f';
    ctx.lineWidth = 2.2;
    if(hot){ ctx.fillStyle = '#14140f'; roundRect(ctx, pillX, pillY, pillW, pillH, 29); ctx.fill(); }
    else{ roundRect(ctx, pillX, pillY, pillW, pillH, 29); ctx.stroke(); }

    ctx.fillStyle = hot ? '#f6f4ef' : '#14140f';
    ctx.font = '600 17px IBM Plex Mono, monospace';
    ctx.fillText('VIEW WORK  →', 512, pillY + pillH/2 - 8);

    screenTex.needsUpdate = true;
  }

  const screenTex = new THREE.CanvasTexture(texCanvas);
  drawScreen(false);
  const screenMat = new THREE.MeshBasicMaterial({ map: screenTex });
  const screenGeo = new THREE.PlaneGeometry(2.36, 1.46);
  const screenMesh = new THREE.Mesh(screenGeo, screenMat);
  screenMesh.name = 'screen';
  screenMesh.position.set(0, 0.1, -0.744);
  screenMesh.rotation.x = -0.08;
  laptop.add(screenMesh);

  // small camera dot on bezel
  const camDotGeo = new THREE.CircleGeometry(0.018, 12);
  const camDotMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const camDot = new THREE.Mesh(camDotGeo, camDotMat);
  camDot.position.set(0, 0.865, -0.742);
  camDot.rotation.x = -0.13;
  laptop.add(camDot);

  // ---------- pointer tracking / parallax tilt ----------
  const cursorDot = document.getElementById('cursorDot');
  const cursorRing = document.getElementById('cursorRing');
  const fadeOverlay = document.getElementById('fadeOverlay');

  const rigTiltX = gsap.quickTo(rig.rotation, 'x', { duration:0.9, ease:'power3.out' });
  const rigTiltY = gsap.quickTo(rig.rotation, 'y', { duration:0.9, ease:'power3.out' });
  const spotX = gsap.quickTo(spot.position, 'x', { duration:0.5, ease:'power2.out' });
  const spotZ = gsap.quickTo(spot.position, 'z', { duration:0.5, ease:'power2.out' });

  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let hovering = false;
  let navigating = false;

  function updateHover(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    if(clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom){
      setHover(false);
      return;
    }
    ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -(((clientY - rect.top) / rect.height) * 2 - 1);
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObject(screenMesh, false).length > 0;
    setHover(hit);
  }

  function setHover(hit){
    if(hit === hovering) return;
    hovering = hit;
    cursorRing.classList.toggle('hot', hit);
    drawScreen(hit);
  }

  function onPointerMove(e){
    const cx = e.clientX, cy = e.clientY;
    cursorDot.style.left = cx + 'px';
    cursorDot.style.top = cy + 'px';
    cursorRing.style.left = cx + 'px';
    cursorRing.style.top = cy + 'px';

    const nx = (cx / window.innerWidth) * 2 - 1;
    const ny = (cy / window.innerHeight) * 2 - 1;
    rigTiltY(nx * 0.32);
    rigTiltX(ny * 0.14);
    spotX(nx * 3.2);
    spotZ(3 + ny * 1.4);

    updateHover(cx, cy);
  }
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerleave', () => setHover(false));

  function onClick(e){
    if(navigating) return;
    const rect = canvas.getBoundingClientRect();
    if(e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;
    ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
    raycaster.setFromCamera(ndc, camera);
    if(raycaster.intersectObject(screenMesh, false).length === 0) return;

    navigating = true;
    const tl = gsap.timeline({
      onComplete: () => { window.location.href = 'portfolio.html'; }
    });
    tl.to(rig.rotation, { x:0, y:0, duration:0.5, ease:'power2.out' }, 0)
      .to(camera.position, { x:0, y:0.15, z:1.55, duration:1.15, ease:'power3.inOut' }, 0)
      .to(camera, {
        fov: 20, duration:1.15, ease:'power3.inOut',
        onUpdate: () => camera.updateProjectionMatrix()
      }, 0)
      .to(fadeOverlay, { opacity:1, duration:0.55, ease:'power1.in' }, '-=0.4');
  }
  window.addEventListener('click', onClick);

  // ---------- resize ----------
  window.addEventListener('resize', sizeRenderer);

  // ---------- render loop ----------
  const clock = new THREE.Clock();
  function tick(){
    const t = clock.getElapsedTime();
    rock.rotation.y = Math.sin(t * 0.05) * 0.02;
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();

  requestAnimationFrame(() => {
    loading.style.opacity = '0';
    setTimeout(() => loading.style.display = 'none', 500);
  });
})();
</script>

</body>
</html>
