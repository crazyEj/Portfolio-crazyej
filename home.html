<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erick James Sibayan — Portfolio Render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { background: linear-gradient(180deg, #dee0dd 0%, #f5f5f3 100%); font-family:'IBM Plex Sans', sans-serif; }
  #c { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  const canvas = document.getElementById('c');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe2e1dc);

  const camera = new THREE.PerspectiveCamera(window.innerWidth < 640 ? 48 : 32, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.9, 5.2);
  camera.lookAt(0, 0.15, 0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  function resize(){
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = window.innerWidth < 640 ? 48 : 32;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  const ambient = new THREE.AmbientLight(0xffffff, 0.45);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
  keyLight.position.set(-2.4, 3.6, 2.8);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xdedede, 0.32);
  fillLight.position.set(2.4, 1.8, -2.4);
  scene.add(fillLight);

  const rimLight = new THREE.PointLight(0xcfd6e2, 0.22, 10);
  rimLight.position.set(-1.8, 2.2, -2.1);
  scene.add(rimLight);

  const shadowPlane = new THREE.PlaneGeometry(30, 30);
  const shadowMat = new THREE.ShadowMaterial({ opacity:0.14 });
  const shadowMesh = new THREE.Mesh(shadowPlane, shadowMat);
  shadowMesh.rotation.x = -Math.PI / 2;
  shadowMesh.position.y = -1.8;
  shadowMesh.receiveShadow = true;
  scene.add(shadowMesh);

  const rockGeo = new THREE.IcosahedronGeometry(1.9, 1);
  const posAttr = rockGeo.attributes.position;
  const temp = new THREE.Vector3();
  for(let i=0; i<posAttr.count; i++){
    temp.fromBufferAttribute(posAttr, i);
    const normal = temp.clone().normalize();
    const offset = (Math.random() - 0.35) * 0.45;
    temp.addScaledVector(normal, offset);
    posAttr.setXYZ(i, temp.x, temp.y, temp.z);
  }
  rockGeo.computeVertexNormals();

  const rockMat = new THREE.MeshStandardMaterial({ color:0x1c1c1c, roughness:0.92, metalness:0.05 });
  const rock = new THREE.Mesh(rockGeo, rockMat);
  rock.scale.set(1.6, 1.0, 1.6);
  rock.position.set(0, -1.2, 0);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);

  const monitor = new THREE.Group();
  monitor.position.set(0, -0.12, 0);
  scene.add(monitor);

  const frameMat = new THREE.MeshStandardMaterial({ color:0x1f1f1f, roughness:0.28, metalness:0.58 });
  const frameGeo = new THREE.BoxGeometry(3.5, 2.15, 0.08);
  const frame = new THREE.Mesh(frameGeo, frameMat);
  frame.position.set(0, 0.92, 0);
  frame.castShadow = true;
  frame.receiveShadow = true;
  monitor.add(frame);

  const screenCanvas = document.createElement('canvas');
  screenCanvas.width = 2048;
  screenCanvas.height = 1280;
  const ctx = screenCanvas.getContext('2d');

  function drawScreen(){
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, screenCanvas.width, screenCanvas.height);

    ctx.fillStyle = '#111111';
    ctx.textAlign = 'center';
    ctx.font = '600 36px IBM Plex Sans';
    ctx.fillText('HOME', 300, 72);
    ctx.fillText('ABOUT', 640, 72);
    ctx.fillText('PROJECTS', 1020, 72);
    ctx.fillText('CONTACT', 1400, 72);

    ctx.font = '800 108px IBM Plex Sans';
    ctx.fillText('ERICK JAMES', screenCanvas.width / 2, 520);
    ctx.fillText('SIBAYAN', screenCanvas.width / 2, 650);

    ctx.font = '500 22px IBM Plex Mono';
    ctx.textAlign = 'left';
    ctx.fillText('A refined portfolio experience with modern layout, bold typography, and minimalist style.', 180, 1140);
    ctx.fillText('Studio • Work • Contact', 180, 1195);
    ctx.textAlign = 'right';
    ctx.fillText('2026 • Erick James Sibayan', screenCanvas.width - 180, 1195);
  }
  drawScreen();

  const screenTexture = new THREE.CanvasTexture(screenCanvas);
  screenTexture.encoding = THREE.sRGBEncoding;
  screenTexture.needsUpdate = true;

  const screenMat = new THREE.MeshBasicMaterial({ map: screenTexture });
  const screenGeo = new THREE.PlaneGeometry(3.12, 1.82);
  const screen = new THREE.Mesh(screenGeo, screenMat);
  screen.position.set(0, 0.92, 0.07);
  monitor.add(screen);

  const supportGeo = new THREE.BoxGeometry(2.3, 0.05, 0.18);
  const support = new THREE.Mesh(supportGeo, frameMat);
  support.position.set(0, 0.62, 0);
  support.castShadow = true;
  support.receiveShadow = true;
  monitor.add(support);

  const dotGeo = new THREE.CircleGeometry(0.02, 20);
  const dot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0x0b0b0b }));
  dot.position.set(0, 1.02, 0.07);
  dot.rotation.x = -0.02;
  monitor.add(dot);

  const clock = new THREE.Clock();
  function render(){
    const t = clock.getElapsedTime();
    rock.rotation.y = Math.sin(t * 0.04) * 0.04;
    renderer.render(scene, camera);
    requestAnimationFrame(render);
  }
  render();
})();
</script>
</body>
</html>
